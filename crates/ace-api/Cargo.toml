[package]
name = "ace-api"
version = "0.5.5"
edition = "2024"
authors = ["Samuel Preston <samp.reston@outlook.com>"]
description = "Batteries-included entry point for the ACE diagnostics stack, alloc-enabled by default. For no_std/embedded use, depend on the individual ace-* crates directly."
readme = "README.md"
repository = "https://github.com/samp-reston/ace"
license = "MIT or Apache-2.0"
keywords = ["diagnostics", "vehicle", "standards"]
categories = ["development-tools", "network-programming", "automotive"]

[lib]
name = "aced"

[features]
default = ["alloc"]
alloc = [
	"ace-core/alloc",
	"ace-macros/alloc",
	"ace-proto/alloc",
	"ace-can/alloc",
	"ace-sim/alloc",
	"ace-uds/alloc",
	"ace-doip/alloc",
	"ace-client/alloc",
	"ace-server/alloc",
	"ace-gateway/alloc",
]
serde = ["ace-doip/serde", "ace-uds/serde"]
tokio = ["ace-doip/tokio", "alloc"]

[dependencies]
ace-core = { workspace = true }
ace-macros = { workspace = true }
ace-proto = { workspace = true }
ace-can = { workspace = true }
ace-sim = { workspace = true }
ace-uds = { workspace = true }
ace-doip = { workspace = true }
ace-client = { workspace = true }
ace-server = { workspace = true }
ace-gateway = { workspace = true }
