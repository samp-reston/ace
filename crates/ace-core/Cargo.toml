[package]
name = "ace-core"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
authors = ["Samuel Preston <samp.reston@outlook.com>"]
description = "Foundation layer for ACE: codec traits (FrameRead, FrameWrite, Writer), bounded storage, and the time, addressing, transport, randomness, and diagnostic-node abstractions every other ace-* crate builds on. no_std, no allocator required."
readme = "README.md"
repository = "https://github.com/samp-reston/ace"
license = "MIT or Apache-2.0"
keywords = ["diagnostics", "vehicle", "standards"]
categories = ["development-tools", "network-programming", "automotive"]

[features]
default = []
alloc = ["bytes"]
std = ["alloc", "heapless/defmt"]

[dependencies]
heapless = { workspace = true }
bytes = { workspace = true, optional = true }
