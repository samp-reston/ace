[package]
name = "ace-client"
version = "0.5.5"
edition = "2024"
rust-version = "1.85"
authors = ["Samuel Preston <samp.reston@outlook.com>"]
description = "UDS tester client state machine."
readme = "README.md"
repository = "https://github.com/samp-reston/ace"
license = "MIT or Apache-2.0"
keywords = ["diagnostics", "vehicle", "standards"]
categories = ["development-tools", "network-programming", "automotive"]

[features]
default = []
alloc = ["ace-core/alloc", "ace-uds/alloc", "ace-proto/alloc"]
std = [
	"alloc",
	"ace-core/std",
	"ace-uds/std",
	
	"ace-proto/std",
	
]

[dependencies]
ace-core = { workspace = true }
ace-proto = { workspace = true }
ace-uds = { workspace = true }

[dev-dependencies]
ace-server = { workspace = true }
