name: CI

on:
  push:
    branches:
      - main
      - "phase/**"
    tags:
      - "v*"
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_DIR: target
  CARGO_BUILD_JOBS: "2"
  RUST_BACKTRACE: "1"

jobs:
  matrix:
    name: Feature, target, and test matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
          targets: thumbv7em-none-eabihf

      - name: Install cargo-hack
        run: cargo install cargo-hack --version 0.6.45 --locked

      - name: Run canonical matrix
        run: sh ci/verify-matrix.sh

  msrv:
    name: Rust 1.88 MSRV
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install MSRV toolchain
        run: rustup toolchain install 1.88.0 --profile minimal

      - name: Install cargo-msrv
        run: cargo install cargo-msrv --version 0.19.3 --locked

      - name: Run canonical MSRV verification
        run: sh ci/verify-msrv.sh

  package:
    name: Package and verify workspace
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Package and verify
        run: cargo package --workspace --locked

  semver:
    name: Published API semver
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Cache Cargo registry and Git dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install cargo-semver-checks
        run: cargo install cargo-semver-checks --version 0.47.0 --locked

      - name: Run canonical semver verification
        run: sh ci/verify-semver.sh

  release-config:
    name: Release configuration
    if: github.ref_type == 'tag'
    needs:
      - matrix
      - msrv
      - package
      - semver
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.97.0

      - name: Install cargo-release
        run: cargo install cargo-release --version 1.1.2 --locked

      - name: Validate release configuration
        run: cargo release config
