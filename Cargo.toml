[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.dependencies]
heapless = { version = "0.9.2" }

bytes = { version = "1.11.1" }
darling = { version = "0.23.0" }
proc-macro2 = { version = "1.0.106" }
quote = { version = "1.0.45" }
syn = { version = "2.0.117" }
trybuild = { version = "1.0.116" }
proptest = { version = "1.10.0" }
serde = { version = "1.0.228" }
tokio-util = { version = "0.7.18" }
# default-features = false is required: derive_more's defaults enable `std`, and
# it does not declare `#![no_std]`, so leaving them on makes every dependent
# crate unbuildable for a bare-metal target. Consumers opt into the derives they
# need, and wire `derive_more/std` from their own `std` feature.
derive_more = { version = "2.1.1", default-features = false }

aced = { package = "ace-api", path = "crates/ace-api", version = "0.5.5" }
ace-core = { path = "crates/ace-core", version = "0.5.5" }
ace-macros = { path = "crates/ace-macros", version = "0.5.5" }
ace-proto = { path = "crates/ace-proto", version = "0.5.5" }
ace-can = { path = "crates/ace-can", version = "0.5.5" }
ace-sim = { path = "crates/ace-sim", version = "0.5.5" }
ace-uds = { path = "crates/ace-uds", version = "0.5.5" }
ace-doip = { path = "crates/ace-doip", version = "0.5.5" }
ace-server = { path = "crates/ace-server", version = "0.5.5" }
ace-client = { path = "crates/ace-client", version = "0.5.5" }
ace-gateway = { path = "crates/ace-gateway", version = "0.5.5" }
ace-transport = { path = "crates/ace-transport", version = "0.5.5" }
